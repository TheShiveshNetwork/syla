name: Changelog

on:
  pull_request:
    types: [closed]
    branches: [master, main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "**.png"
      - "**.jpg"
      - "**.svg"
      - "LICENSE*"
      - ".gitignore"
      - "CHANGELOG.md"
  push:
    branches: [master, main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "**.png"
      - "**.jpg"
      - "**.svg"
      - "LICENSE*"
      - ".gitignore"
      - "CHANGELOG.md"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: changelog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changelog:
    # Run on push to default branch (direct pushes) OR when a PR is actually merged
    # Skips bot commits to avoid loops from auto-commit
    if: |
      (github.event_name == 'push' && github.actor != 'github-actions[bot]') ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force

      # ── Auto version bump on merge/push ────────────────────────────
      # Starts at v0.0.0, bumps MINOR (v0.0.0 -> v0.1.0 -> v0.2.0 ...)
      # If HEAD already has a tag (you manually pushed v1.2.3), that tag wins
      # and no auto-bump happens — the pushed tag will trigger release.yml.
      # Runs on PR merge AND on direct push to master (if you push directly)
      - name: Auto bump minor version
        id: bump
        if: |
          (github.event_name == 'pull_request' && github.event.pull_request.merged == true) ||
          (github.event_name == 'push' && github.actor != 'github-actions[bot]')
        run: |
          set -e
          # If this merge commit already points at a tag, respect it (manual tag overrides auto)
          existing_tag=$(git tag --points-at HEAD | head -n1 || true)
          if [ -n "$existing_tag" ]; then
            echo "HEAD already tagged as $existing_tag - skipping auto bump"
            echo "next_tag=$existing_tag" >> $GITHUB_OUTPUT
            echo "skipped=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          latest=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Latest tag: $latest"

          # Strip v prefix and split
          ver=${latest#v}
          IFS='.' read -r major minor patch <<< "$ver"
          major=${major:-0}; minor=${minor:-0}; patch=${patch:-0}
          # Bump MINOR, reset patch (v0.0.0 -> v0.1.0)
          minor=$((minor + 1))
          patch=0
          next_tag="v${major}.${minor}.${patch}"
          echo "Next tag: $next_tag"

          # Ensure tag doesn't already exist (race)
          if git rev-parse "$next_tag" >/dev/null 2>&1; then
            echo "Tag $next_tag already exists, skipping"
            echo "skipped=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "next_tag=$next_tag" >> $GITHUB_OUTPUT
          echo "skipped=false" >> $GITHUB_OUTPUT

          git tag -a "$next_tag" -m "chore: bump to $next_tag [skip ci]"
          echo "Created tag $next_tag locally (will be pushed after changelog commit)"

      - name: Generate changelog with git-cliff
        run: |
          # If we just bumped, tell git-cliff about the new tag so it appears in changelog
          if [ "${{ steps.bump.outputs.next_tag }}" != "" ] && [ "${{ steps.bump.outputs.skipped }}" != "true" ]; then
            TAG="${{ steps.bump.outputs.next_tag }}"
            echo "Generating changelog for $TAG"
            # Use --tag to force the new version even though tag not yet pushed
            if [ -f cliff.toml ]; then
              git-cliff --tag "$TAG" --output CHANGELOG.md --verbose || git cliff --tag "$TAG" --output CHANGELOG.md --verbose
            fi
          fi
          # Fallback / normal generation (also covers direct pushes without bump)
          if ! command -v git-cliff >/dev/null 2>&1; then
            echo "Installing git-cliff via action"
          fi
          # Try git-cliff action style (if binary missing, use docker)
          if [ ! -f CHANGELOG.md ] || [ "${{ steps.bump.outputs.next_tag }}" == "" ]; then
            echo "Running git-cliff for unreleased + tagged history"
            # `orhun/git-cliff-action` is used as separate step below, but we also support direct binary
            # If action didn't run, try npx fallback
            if ! grep -q "## \[v" CHANGELOG.md 2>/dev/null; then
              echo "Changelog will be generated by next step"
            fi
          fi
        continue-on-error: true

      - name: Install git-cliff (via action)
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose
        env:
          OUTPUT: CHANGELOG.md
        continue-on-error: true

      - name: Fallback - conventional-changelog
        if: failure()
        run: |
          npm install -g conventional-changelog-cli 2>/dev/null || npm i -g conventional-changelog-cli
          if [ ! -f CHANGELOG.md ]; then
            echo "# Changelog" > CHANGELOG.md
            echo "" >> CHANGELOG.md
            echo "All notable changes to this project will be documented in this file." >> CHANGELOG.md
            echo "" >> CHANGELOG.md
          fi
          conventional-changelog -p angular -i CHANGELOG.md -s -r 0 || echo "conventional-changelog fallback done"

      - name: Ensure changelog header
        run: |
          if [ ! -f CHANGELOG.md ]; then
            echo "# Changelog" > CHANGELOG.md
            echo "" >> CHANGELOG.md
            echo "All notable changes to this project will be documented in this file." >> CHANGELOG.md
          fi
          head -n 30 CHANGELOG.md

      - name: Commit changelog (and new tag if bumped)
        run: |
          git add CHANGELOG.md || true
          # If we created a tag, the changelog already contains it
          if [ -n "${{ steps.bump.outputs.next_tag }}" ] && [ "${{ steps.bump.outputs.skipped }}" != "true" ]; then
            TAG="${{ steps.bump.outputs.next_tag }}"
            if git diff --cached --quiet; then
              echo "No changelog changes to commit, but still pushing tag $TAG"
            else
              git commit -m "docs: update CHANGELOG.md for $TAG [skip ci]"
            fi
            # Push commit and tag together - tag push triggers release.yml
            git push origin HEAD:master || git push origin HEAD:main || true
            git push origin "$TAG"
            echo "Pushed $TAG - release.yml will now build binaries"
          else
            # Normal changelog update without version bump (direct push case)
            if git diff --cached --quiet; then
              echo "No changelog changes"
              exit 0
            fi
            # If this was a PR merge but we skipped bump because tag existed, just push changelog
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              MSG="docs: update CHANGELOG.md [skip ci]"
            else
              MSG="docs: update CHANGELOG.md [skip ci]"
            fi
            git commit -m "$MSG"
            git push origin HEAD:master || git push origin HEAD:main || git push
          fi

      - name: Add PR comment with changelog preview
        if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let preview = '';
            let tag = '${{ steps.bump.outputs.next_tag }}';
            try { preview = fs.readFileSync('CHANGELOG.md', 'utf8').split('\n').slice(0,45).join('\n'); } catch(e) { preview = '_no changelog yet_'; }
            const tagMsg = tag && tag !== '' ? `\n\n**Version bumped to \`${tag}\`** - release workflow triggered.` : '';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### Changelog updated :memo:${tagMsg}\n\n\`\`\`markdown\n${preview}\n\`\`\`\n\n> Auto-generated from conventional commits. Next version: \`${tag || 'unreleased'}\`.`
            });
